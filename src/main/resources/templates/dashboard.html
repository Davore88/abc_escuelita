<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard - Control Escolar')}"></head>
<body class="bg-gray-50 min-h-screen">
    
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="max-w-7xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
        
        <div class="mb-8">
            <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight">Bienvenido al Panel de Control</h1>
            <p class="mt-2 text-lg text-gray-600">Gestiona los accesos, alumnos y avisos de tu institución.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Card 1 -->
            <a th:href="@{/students}" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 hover:shadow-md hover:border-brand-300 transition duration-200 group">
                <div class="flex items-center">
                    <div class="p-3 rounded-xl bg-blue-100 text-blue-600 group-hover:scale-110 transition transform">
                        <i class="fa-solid fa-user-graduate text-2xl"></i>
                    </div>
                    <div class="ml-5">
                        <h2 class="text-xl font-bold text-gray-800">Alumnos</h2>
                        <p class="text-gray-500 text-sm mt-1">Registrar y gestionar</p>
                    </div>
                </div>
            </a>

            <!-- Card 2 -->
            <a th:href="@{/scanner}" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 hover:shadow-md hover:border-brand-300 transition duration-200 group">
                <div class="flex items-center">
                    <div class="p-3 rounded-xl bg-brand-100 text-brand-600 group-hover:scale-110 transition transform">
                        <i class="fa-solid fa-qrcode text-2xl"></i>
                    </div>
                    <div class="ml-5">
                        <h2 class="text-xl font-bold text-gray-800">Escáner QR</h2>
                        <p class="text-gray-500 text-sm mt-1">Registrar accesos</p>
                    </div>
                </div>
            </a>

            <!-- Card 3 -->
            <a th:href="@{/announcements}" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 hover:shadow-md hover:border-brand-300 transition duration-200 group">
                <div class="flex items-center">
                    <div class="p-3 rounded-xl bg-purple-100 text-purple-600 group-hover:scale-110 transition transform">
                        <i class="fa-solid fa-paper-plane text-2xl"></i>
                    </div>
                    <div class="ml-5">
                        <h2 class="text-xl font-bold text-gray-800">Avisos</h2>
                        <p class="text-gray-500 text-sm mt-1">Enviar comunicados</p>
                    </div>
                </div>
            </a>

            <!-- Card 4 -->
            <a th:href="@{/reports}" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 hover:shadow-md hover:border-brand-300 transition duration-200 group">
                <div class="flex items-center">
                    <div class="p-3 rounded-xl bg-orange-100 text-orange-600 group-hover:scale-110 transition transform">
                        <i class="fa-solid fa-chart-pie text-2xl"></i>
                    </div>
                    <div class="ml-5">
                        <h2 class="text-xl font-bold text-gray-800">Reportes</h2>
                        <p class="text-gray-500 text-sm mt-1">Consultar bitácora</p>
                    </div>
                </div>
            </a>
        </div>
        
    </main>

</body>
</html>
