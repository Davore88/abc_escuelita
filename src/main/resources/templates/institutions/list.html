<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Gestión de Instituciones - Control Escolar')}"></head>
<body class="bg-gray-50 min-h-screen">
    
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="max-w-7xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
        
        <div class="sm:flex sm:items-center sm:justify-between mb-8">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Instituciones</h1>
                <p class="mt-2 text-sm text-gray-600">Módulo exclusivo para el administrador root.</p>
            </div>
            <div class="mt-4 sm:mt-0">
                <a th:href="@{/institutions/create}" class="inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-colors">
                    <i class="fa-solid fa-plus mr-2"></i> Registrar Institución
                </a>
            </div>
        </div>

        <div th:if="${successMessage}" class="mb-6 bg-green-50 border border-green-200 text-green-800 rounded-lg p-4 flex items-center">
            <i class="fa-solid fa-circle-check text-green-500 mr-3 text-lg"></i>
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="mb-6 bg-red-50 border border-red-200 text-red-800 rounded-lg p-4 flex items-center">
            <i class="fa-solid fa-circle-xmark text-red-500 mr-3 text-lg"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <div class="bg-white shadow-sm rounded-2xl overflow-hidden border border-gray-100">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50/50">
                        <tr>
                            <th scope="col" class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">ID</th>
                            <th scope="col" class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Nombre</th>
                            <th scope="col" class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Dirección</th>
                            <th scope="col" class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Director</th>
                            <th scope="col" class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-100">
                        <tr th:each="inst : ${institutions}" class="hover:bg-gray-50/50 transition-colors">
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${inst.id}">1</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="font-medium text-gray-900" th:text="${inst.name}">Escuela Demo</div>
                            </td>
                            <td class="px-6 py-4 text-sm text-gray-500" th:text="${inst.address ?: 'Sin dirección'}">Centro</td>
                            <td class="px-6 py-4 text-sm text-gray-500">
                                <span th:if="${inst.admins != null and !#lists.isEmpty(inst.admins)}" 
                                      th:text="${inst.admins[0].firstName != null ? inst.admins[0].firstName + ' ' + inst.admins[0].lastName : inst.admins[0].username}">
                                    Director
                                </span>
                                <span th:unless="${inst.admins != null and !#lists.isEmpty(inst.admins)}" class="text-gray-400 italic">
                                    Sin asignar
                                </span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium flex items-center space-x-3">
                                <a th:href="@{/institutions/edit/{id}(id=${inst.id})}" class="text-blue-600 hover:text-blue-900 bg-blue-50 hover:bg-blue-100 px-3 py-1 rounded-md transition-colors" title="Editar Institución">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </a>
                                <a th:href="@{/institutions/{id}/directors/create(id=${inst.id})}" class="text-brand-600 hover:text-brand-900 bg-brand-50 hover:bg-brand-100 px-3 py-1 rounded-md transition-colors">
                                    <i class="fa-solid fa-user-tie mr-1"></i> Añadir Director
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(institutions)}">
                            <td colspan="5" class="px-6 py-12 text-center text-gray-500">
                                <i class="fa-solid fa-building text-4xl text-gray-300 mb-3"></i>
                                <p class="text-lg">No hay instituciones registradas.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
    </main>

</body>
</html>
