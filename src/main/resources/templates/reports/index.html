<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body class="bg-gray-50 min-h-screen">
    <div th:replace="~{fragments/layout :: navbar}"></div>
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="mb-8 flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Reportes de Asistencia</h1>
                <p class="text-gray-600 mt-2">Genere un reporte en PDF de las entradas y salidas de un alumno.</p>
            </div>
            <div>
                <i class="fa-solid fa-file-pdf text-5xl text-red-500"></i>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-100">
            <div class="bg-gray-50 border-b border-gray-100 px-6 py-4">
                <h2 class="text-lg font-semibold text-gray-800"><i class="fa-solid fa-filter mr-2 text-brand-600"></i> Filtros del Reporte</h2>
            </div>
            
            <form th:action="@{/reports/download}" method="post" class="p-6">
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                    
                    <!-- Seleccionar Alumno -->
                    <div>
                        <label for="studentId" class="block text-sm font-medium text-gray-700 mb-2">Alumno</label>
                        <select id="studentId" name="studentId" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-brand-500 focus:border-brand-500">
                            <option value="">-- Seleccione un Alumno --</option>
                            <option th:each="student : ${students}" 
                                    th:value="${student.id}" 
                                    th:text="${student.firstName + ' ' + student.lastName}">
                            </option>
                        </select>
                    </div>

                    <!-- Fecha Inicio -->
                    <div>
                        <label for="startDate" class="block text-sm font-medium text-gray-700 mb-2">Fecha Inicio</label>
                        <input type="date" id="startDate" name="startDate" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-brand-500 focus:border-brand-500">
                    </div>

                    <!-- Fecha Fin -->
                    <div>
                        <label for="endDate" class="block text-sm font-medium text-gray-700 mb-2">Fecha Fin</label>
                        <input type="date" id="endDate" name="endDate" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-brand-500 focus:border-brand-500">
                    </div>

                </div>

                <div class="flex justify-end pt-4 border-t border-gray-100">
                    <button type="submit" class="bg-brand-600 hover:bg-brand-700 text-white font-bold py-2 px-6 rounded-lg shadow-md transition duration-200 flex items-center">
                        <i class="fa-solid fa-download mr-2"></i> Descargar PDF
                    </button>
                </div>
            </form>
        </div>

    </main>
</body>
</html>
