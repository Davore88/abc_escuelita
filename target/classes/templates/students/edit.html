<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Editar Alumno - Control Escolar')}"></head>
<body class="bg-gray-50 min-h-screen text-gray-800 font-sans antialiased">
    
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="max-w-3xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
        
        <div class="mb-8">
            <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Editar Datos del Alumno</h1>
            <p class="mt-2 text-lg text-gray-600">Actualiza la información personal del estudiante.</p>
        </div>

        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
            <form th:action="@{/students/edit/{id}(id=${student.id})}" method="post" class="p-8">
                
                <div class="space-y-6">
                    <h2 class="text-xl font-bold text-gray-800 border-b pb-2"><i class="fa-solid fa-user-pen text-brand-500 mr-2"></i>Información del Alumno</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Nombre(s) *</label>
                            <input type="text" name="studentFirstName" th:value="${student.firstName}" required
                                   class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-brand-500 focus:border-brand-500" placeholder="Ej. Juan Pérez">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Apellidos *</label>
                            <input type="text" name="studentLastName" th:value="${student.lastName}" required
                                   class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-brand-500 focus:border-brand-500" placeholder="Ej. López Gómez">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Grupo asignado</label>
                            <input type="text" name="studentGroup" th:value="${student.groupName}"
                                   class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-brand-500 focus:border-brand-500" placeholder="Ej. 1A">
                        </div>
                    </div>

                    <div class="pt-6 flex justify-between">
                        <a th:href="@{/students}" class="bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 font-bold py-3 px-8 rounded-xl shadow-sm transition-colors flex items-center">
                            <i class="fa-solid fa-arrow-left mr-2"></i> Cancelar
                        </a>
                        <button type="submit" class="bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 px-8 rounded-xl shadow-md transition-transform transform hover:-translate-y-1 flex items-center">
                            <i class="fa-solid fa-save mr-2"></i> Guardar Cambios
                        </button>
                    </div>
                </div>

            </form>
        </div>
    </main>

</body>
</html>
