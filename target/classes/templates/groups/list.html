<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Gestión de Grupos - Control Escolar')}"></head>
<body class="bg-gray-50 min-h-screen text-gray-800 font-sans antialiased">
    
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <main class="max-w-7xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
        
        <div class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Gestión de Grupos</h1>
                <p class="mt-2 text-sm text-gray-600">Administra los grupos de estudiantes de la institución.</p>
            </div>
            <button onclick="openModal()" class="bg-brand-600 hover:bg-brand-700 text-white font-bold py-2.5 px-5 rounded-xl shadow-md transition-colors flex items-center">
                <i class="fa-solid fa-plus mr-2"></i> Nuevo Grupo
            </button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">ID</th>
                            <th scope="col" class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Nombre del Grupo</th>
                            <th scope="col" class="px-6 py-4 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr th:each="group : ${groups}" class="hover:bg-gray-50 transition-colors">
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${group.id}">1</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="px-3 py-1 inline-flex text-sm leading-5 font-semibold rounded-full bg-blue-100 text-blue-800" th:text="${group.name}">1A</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-center text-sm font-medium">
                                <form th:action="@{/groups/delete/{id}(id=${group.id})}" method="post" class="inline" onsubmit="return confirm('¿Estás seguro de eliminar este grupo?');">
                                    <button type="submit" class="text-red-600 hover:text-red-900 bg-red-50 hover:bg-red-100 p-2 rounded-lg transition-colors" title="Eliminar Grupo">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(groups)}">
                            <td colspan="3" class="px-6 py-12 text-center text-gray-500">
                                <i class="fa-solid fa-users text-4xl text-gray-300 mb-3 block"></i>
                                No hay grupos registrados en esta institución.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Modal for New Group -->
    <div id="newGroupModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-xl transform transition-all">
            <h3 class="text-xl font-bold mb-4 flex items-center text-gray-800"><i class="fa-solid fa-users mr-2 text-brand-600"></i>Crear Nuevo Grupo</h3>
            <form th:action="@{/groups/create}" method="post">
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-gray-700 mb-2" for="name">Nombre del Grupo</label>
                    <input type="text" id="name" name="name" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-brand-500 focus:border-brand-500 transition-colors" placeholder="Ej. 1A, 2B, Secundaria...">
                </div>
                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closeModal()" class="px-5 py-2.5 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-xl font-medium transition-colors">Cancelar</button>
                    <button type="submit" class="bg-brand-600 hover:bg-brand-700 text-white px-5 py-2.5 rounded-xl font-bold shadow-md transition-colors">
                        Guardar Grupo
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('newGroupModal').classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('newGroupModal').classList.add('hidden');
        }
    </script>
</body>
</html>
