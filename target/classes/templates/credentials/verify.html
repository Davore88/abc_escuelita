<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Verificación de Credencial')}"></head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans antialiased flex flex-col">
    
    <div class="bg-brand-600 text-white p-4 shadow-md text-center">
        <h1 class="text-xl font-bold">Control Escolar - Verificación</h1>
    </div>

    <main class="flex-grow max-w-2xl mx-auto w-full p-4 sm:p-6 lg:p-8">
        
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden border border-gray-200">
            <div class="bg-brand-50 border-b border-brand-100 px-6 py-4 flex items-center justify-between">
                <h2 class="text-lg font-bold text-brand-800"><i class="fa-solid fa-user-check mr-2"></i>Credencial Válida</h2>
                <span class="bg-green-100 text-green-800 text-xs font-semibold px-2.5 py-0.5 rounded-full"><i class="fa-solid fa-check-circle mr-1"></i>Verificado</span>
            </div>
            
            <div class="p-6">
                <!-- Tutor Info -->
                <div class="flex flex-col sm:flex-row items-center gap-6 mb-8 pb-8 border-b border-gray-100">
                    <div class="w-32 h-32 rounded-full overflow-hidden border-4 border-gray-100 shadow-sm flex-shrink-0 bg-gray-50 flex items-center justify-center">
                        <img th:if="${tutor.photoData != null}" th:src="@{/images/tutor/{id}(id=${tutor.id})}" alt="Foto Tutor" class="w-full h-full object-cover">
                        <i th:unless="${tutor.photoData != null}" class="fa-solid fa-user text-4xl text-gray-400"></i>
                    </div>
                    <div class="text-center sm:text-left">
                        <p class="text-sm font-semibold text-brand-600 uppercase tracking-wider mb-1">Tutor Registrado</p>
                        <h3 class="text-2xl font-bold text-gray-900 mb-2" th:text="${tutor.firstName + ' ' + tutor.lastName}">Nombre</h3>
                        <p class="text-gray-600 flex items-center justify-center sm:justify-start">
                            <i class="fa-solid fa-envelope mr-2 text-gray-400"></i><span th:text="${tutor.email}">email</span>
                        </p>
                    </div>
                </div>

                <!-- Students Info -->
                <div>
                    <h4 class="text-md font-bold text-gray-800 mb-4 border-l-4 border-brand-500 pl-3">Alumnos Asignados</h4>
                    
                    <div class="grid grid-cols-1 gap-4">
                        <div th:each="student : ${tutor.students}" class="bg-gray-50 rounded-xl p-4 flex items-center gap-4 border border-gray-100 transition-shadow hover:shadow-md">
                            <div class="w-16 h-16 rounded-full overflow-hidden border-2 border-white shadow-sm flex-shrink-0 bg-white flex items-center justify-center">
                                <img th:if="${student.photoData != null}" th:src="@{/images/student/{id}(id=${student.id})}" alt="Foto Alumno" class="w-full h-full object-cover">
                                <i th:unless="${student.photoData != null}" class="fa-solid fa-child text-2xl text-gray-400"></i>
                            </div>
                            <div class="flex-grow">
                                <h5 class="font-bold text-gray-900" th:text="${student.firstName + ' ' + student.lastName}">Nombre Alumno</h5>
                                <div class="flex items-center text-sm text-gray-600 mt-1">
                                    <span class="bg-gray-200 px-2 py-0.5 rounded text-xs font-semibold mr-2" th:text="${student.groupName}">Grupo</span>
                                    <span th:if="${student.institution != null}"><i class="fa-solid fa-school text-gray-400 mr-1"></i><span th:text="${student.institution.name}">Escuela</span></span>
                                </div>
                            </div>
                        </div>
                        <div th:if="${tutor.students == null || tutor.students.isEmpty()}" class="text-center py-6 text-gray-500 bg-gray-50 rounded-xl border border-dashed border-gray-300">
                            No hay alumnos asignados a este tutor.
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
    </main>

</body>
</html>
