<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar Sesión - Control Escolar')}"></head>
<body class="bg-gradient-to-br from-brand-50 to-brand-100 min-h-screen flex items-center justify-center p-4">
    
    <div class="bg-white rounded-3xl shadow-xl w-full max-w-md overflow-hidden transform transition-all duration-300 hover:shadow-2xl">
        <!-- Header -->
        <div class="bg-brand-600 p-8 text-center">
            <div class="mx-auto bg-white rounded-full h-20 w-20 flex items-center justify-center mb-4 shadow-lg transform hover:rotate-12 transition-transform duration-300">
                <i class="fa-solid fa-school text-brand-600 text-4xl"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Control<span class="text-brand-200">Escolar</span></h1>
            <p class="text-brand-100 mt-2 font-medium">Bienvenido de nuevo</p>
        </div>

        <!-- Form Section -->
        <div class="p-8">
            <div th:if="${param.error}" class="mb-6 bg-red-50 border-l-4 border-red-500 p-4 rounded-md animate-pulse">
                <div class="flex items-center">
                    <i class="fa-solid fa-circle-exclamation text-red-500 mr-3 text-xl"></i>
                    <p class="text-sm text-red-700 font-medium">Usuario o contraseña incorrectos.</p>
                </div>
            </div>

            <div th:if="${param.logout}" class="mb-6 bg-green-50 border-l-4 border-green-500 p-4 rounded-md">
                <div class="flex items-center">
                    <i class="fa-solid fa-check-circle text-green-500 mr-3 text-xl"></i>
                    <p class="text-sm text-green-700 font-medium">Has cerrado sesión correctamente.</p>
                </div>
            </div>

            <form th:action="@{/login}" method="post" class="space-y-6">
                <div>
                    <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">Usuario</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-user text-gray-400"></i>
                        </div>
                        <input type="text" id="username" name="username" required 
                               class="pl-10 w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-brand-500 focus:border-brand-500 transition-colors duration-200" 
                               placeholder="Ingresa tu usuario">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Contraseña</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-lock text-gray-400"></i>
                        </div>
                        <input type="password" id="password" name="password" required 
                               class="pl-10 w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-brand-500 focus:border-brand-500 transition-colors duration-200" 
                               placeholder="••••••••">
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox" 
                               class="h-4 w-4 text-brand-600 focus:ring-brand-500 border-gray-300 rounded">
                        <label for="remember-me" class="ml-2 block text-sm text-gray-600 font-medium">
                            Recordarme
                        </label>
                    </div>
                    <div class="text-sm">
                        <a href="#" class="font-medium text-brand-600 hover:text-brand-500 transition-colors">¿Olvidaste tu contraseña?</a>
                    </div>
                </div>

                <button type="submit" 
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transform transition-all duration-200 hover:-translate-y-1">
                    Iniciar Sesión <i class="fa-solid fa-arrow-right ml-2 mt-1"></i>
                </button>
            </form>
        </div>
        
        <!-- Footer -->
        <div class="bg-gray-50 px-8 py-4 text-center border-t border-gray-100">
            <p class="text-xs text-gray-500">
                &copy; 2026 Abc Escuelita. Todos los derechos reservados.
            </p>
        </div>
    </div>

</body>
</html>
